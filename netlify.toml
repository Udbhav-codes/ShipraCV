[build]
  command = "npm run build"
  publish = "dist"

# Client-side routing: /work/<slug> and unknown paths are served by index.html,
# and the app renders its own 404 page for paths that do not exist.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
